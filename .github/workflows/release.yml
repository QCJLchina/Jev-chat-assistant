name: 构建并发布 Jev 微信助手

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/frontend/package-lock.json

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: 创建 Python 环境并运行测试
        shell: pwsh
        run: |
          python -m venv .venv-windows-py314
          $python = Join-Path $PWD '.venv-windows-py314/Scripts/python.exe'
          & $python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw '升级 pip 失败' }
          & $python -m pip install -r windows/requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw '安装 Python 依赖失败' }
          & $python -m pytest windows/tests
          if ($LASTEXITCODE -ne 0) { throw 'Python 测试失败' }

      - name: 校验版本标签
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content 'windows/jev_windows/__init__.py' -Raw | Select-String -Pattern '__version__\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "应用版本格式无效：$version" }
          if ('${{ github.event_name }}' -eq 'push') {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tagVersion -ne $version) { throw "版本标签 v$tagVersion 与应用版本 $version 不一致，请先更新 windows/jev_windows/__init__.py" }
          }
          # 避免 Windows PowerShell 5.1 将 GITHUB_OUTPUT 写成 UTF-16。
          Add-Content $env:GITHUB_OUTPUT "version=$version" -Encoding ascii

      - name: 构建 Windows 程序
        shell: pwsh
        run: ./windows/build.ps1

      - name: 打包发布文件
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $packageDir = Join-Path $PWD 'dist/Jev微信助手'
          $exe = Join-Path $packageDir 'Jev微信助手.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf) -or (Get-Item -LiteralPath $exe).Length -eq 0) {
            throw "构建产物缺失或为空：$exe"
          }
          $assetsDir = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null
          $zip = Join-Path $assetsDir "Jev微信助手-v$env:APP_VERSION-windows-x64.zip"
          Compress-Archive -LiteralPath $packageDir -DestinationPath $zip -Force
          if (!(Test-Path -LiteralPath $zip -PathType Leaf) -or (Get-Item -LiteralPath $zip).Length -eq 0) {
            throw "发布压缩包缺失或为空：$zip"
          }
          Get-Item -LiteralPath $zip | Select-Object Name, Length

      - name: 上传手动构建产物
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Jev微信助手-${{ steps.version.outputs.version }}-windows-x64
          path: release-assets/*.zip
          retention-days: 14

      - name: 创建或更新 GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          $zip = "release-assets/Jev微信助手-v$env:APP_VERSION-windows-x64.zip"
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $zip --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:RELEASE_TAG $zip --repo $env:GITHUB_REPOSITORY `
              --title "Jev 微信助手 $env:RELEASE_TAG" --generate-notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw "创建或更新 Release $env:RELEASE_TAG 失败" }
