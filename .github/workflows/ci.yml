name: 持续集成检查

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/frontend/package-lock.json

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows/requirements-dev.txt

      - name: 安装前端依赖并构建
        shell: pwsh
        run: |
          npm ci --prefix windows/frontend --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw '安装前端依赖失败' }
          npm --prefix windows/frontend run build
          if ($LASTEXITCODE -ne 0) { throw 'Vue 前端类型检查或构建失败' }

      - name: 安装 Python 依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw '升级 pip 失败' }
          python -m pip install -r windows/requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw '安装 Python 依赖失败' }

      - name: 运行 Python 测试
        shell: pwsh
        run: |
          python -m pytest windows/tests
          if ($LASTEXITCODE -ne 0) { throw 'Python 测试失败' }
