name: 持续集成检查

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/frontend/package-lock.json

      - name: 配置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows/requirements-dev.txt

      - name: 安装前端依赖并构建
        shell: pwsh
        run: |
          npm ci --prefix windows/frontend --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw '安装前端依赖失败' }
          npm --prefix windows/frontend run build
          if ($LASTEXITCODE -ne 0) { throw 'Vue 前端类型检查或构建失败' }

      - name: 安装 Python 依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw '升级 pip 失败' }
          python -m pip install -r windows/requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw '安装 Python 依赖失败' }

      - name: 运行 Python 测试
        shell: pwsh
        run: |
          python -m pytest windows/tests
          if ($LASTEXITCODE -ne 0) { throw 'Python 测试失败' }

      - name: 校验前端构建产物是否最新
        shell: pwsh
        run: |
          # 上一步刚构建过前端，这里应当恒为新鲜。若失败，说明有源码/翻译改动
          # 没有反映到 windows/frontend/dist，发布包里会出现旧界面。
          ./windows/start.ps1 -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw '前端构建产物已过期' }

      - name: 运行前端界面冒烟测试
        shell: pwsh
        run: |
          python -m pip install -r windows/requirements-smoke.txt
          if ($LASTEXITCODE -ne 0) { throw '安装前端冒烟依赖失败' }
          $server = Start-Process npm.cmd -ArgumentList '--prefix','windows/frontend','run','preview' -PassThru -NoNewWindow
          try {
            $ready = $false
            foreach ($attempt in 1..40) {
              try {
                Invoke-WebRequest -Uri 'http://127.0.0.1:4173' -UseBasicParsing -TimeoutSec 2 | Out-Null
                $ready = $true
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'Vite preview 未在预期时间内就绪' }
            $env:JEV_FRONTEND_URL = 'http://127.0.0.1:4173'
            # ui_smoke 的 mock 不返回 resolved_language，前端会回退到 zh-CN，
            # 因此断言不受 runner 系统语言影响。msedge 通道在 windows-latest 上
            # 无需 playwright install。
            $env:JEV_BROWSER_CHANNEL = 'msedge'
            python windows/tests/ui_smoke.py
            if ($LASTEXITCODE -ne 0) { throw '前端界面冒烟测试失败' }
          }
          finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
